[project]
name = "megawatties"
version = "0.1.0"
description = "NZ wholesale electricity price capture and ingestion."
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.60",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
megawatties-capture = "capture.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
